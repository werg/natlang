id: h3-partial-freeze-unfreeze
title: Partial lambdas cannot be triggered; in is frozen on trigger and thawed on quiescence
kind: harness
stub_agent:
  # keyed by a substring of the child's instructions
  "Say hello":
    - action: |
        set args/name : Text
        Bob
      expect: { result: rejected, codes: [not-writable] }   # a lambda's own `args` is read-only
    - close: "I cannot proceed: no name was given that I recognise."
setup:
  $lambda:
    type: 'Lambda<{ name: Text }, Text>'
    instructions: |
      Get a greeting written.
    args:
      name: "Ada"
script:
  - action: |
      set return : Lambda<{ name: Text }, Text>
      instructions: Say hello to `args/name`.
    expect: { result: ok }
  - action: |
      reduce return
    expect: { result: refused, codes: [unbound-param], paths: [return/args/name] }
  - action: |
      copy args/name to return/args/name
    expect: { result: ok }
  - action: |
      set args/name : Text
      Grace
    expect: { result: rejected, codes: [not-writable] }
  - action: |
      reduce return
    expect: { result: quiesced, note_contains: "cannot proceed" }
  - action: |
      set return/args/name : Text
      Grace
    expect: { result: ok }   # thawed after quiescence
