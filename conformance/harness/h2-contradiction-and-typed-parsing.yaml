id: h2-contradiction-and-typed-parsing
title: Lies are rejected at write; YAML scalars are read against the declared type
kind: harness
decoding: unconstrained   # these actions must be rejected by validation, not by the grammar
setup:
  $lambda:
    type: 'Lambda<{}, { code: Text, flag: Text, n: Num, level: "low" | "high" }>'
    instructions: |
      Fill in the record.
script:
  - action: |
      set return/n : Num
      many
    expect: { result: rejected, codes: [type-mismatch], tree_changed: false }
  - action: |
      set return/level : "low" | "high"
      medium
    expect: { result: rejected, codes: [type-mismatch], tree_changed: false }
  - action: |
      set return/extra : Text
      hello
    expect: { result: rejected, codes: [unknown-field], tree_changed: false }
  - action: |
      set return/n : Text
      12
    expect: { result: rejected, codes: [type-does-not-fit-slot], tree_changed: false }
  - action: |
      set return/code : Text
      0077
    expect: { result: ok, read: { path: return/code, value: "0077" } }
  - action: |
      set return/flag : Text
      no
    expect: { result: ok, read: { path: return/flag, value: "no" } }
