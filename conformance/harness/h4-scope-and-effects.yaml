id: h4-scope-and-effects
title: Scope is the subtree; effects must be declared and cannot widen in children
kind: harness
decoding: unconstrained
setup:
  $lambda:
    type: 'Lambda<{ x: Num }, Num>'
    effects: [out.emit]
    instructions: |
      Test scope and effects.
    args: { x: 1 }
script:
  - action: |
      read ../sibling
    expect: { result: rejected, codes: [out-of-scope] }
  - action: |
      eval
      fx.out.emit({ x: args.x })
    expect: { result: ok, journal_entries: 1 }
  - action: |
      eval
      fx.fs.write("/tmp/x", "1")
    expect: { result: rejected, codes: [effect-undeclared], journal_entries: 1 }
  - action: |
      eval
      self.return = 3
    expect: { result: rejected, codes: [eval-cannot-write] }
  - action: |
      set return : Lambda<{}, Num>
      effects: [fs.write]
      code: |
        fx.fs.write("/tmp/x", "1"); return 1
    expect: { result: rejected, codes: [effect-wider-than-parent] }
