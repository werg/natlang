id: 19-recursion-tree
title: A recursive named type is flattened crisply, then mapped and counted
kind: program
exercises: [recursive named type, crisp function recursing in code, call over a list, crisp combine]
notes: >
  natlang functions may never call themselves (the loader rejects any cycle): there is no way for the
  interpreter to author a recursive decomposition. A crisp function is plain code, though, and may
  recurse internally to flatten a recursive value; the interpreter never has to reduce the tree by hand.
program:
  $lambda:
    type: 'Lambda<{ root: Unit }, Num>'
    function: count_fruit_units
    types:
      Unit: "{ name: Text, reports: Unit[] }"
    instructions: |
      function count_fruit_units(root) -> Num

        units = flatten_tree(root)
        names = unit_names(units)
        flags = for each n in names: is_fruit_name(n)
        return count_true(flags)
    codebase:
      flatten_tree:
        description: Every unit in the tree, at any depth, as a flat list.
        args: { root: Unit }
        returns: 'Unit[]'
        code: |
          const out = []
          const visit = (u) => { out.push(u); for (const r of u.reports) visit(r) }
          visit(args.root)
          return out
      unit_names:
        description: The name of every unit in a list.
        args: { units: 'Unit[]' }
        returns: 'Text[]'
        code: return args.units.map(u => u.name)
      is_fruit_name:
        description: Is this name a fruit?
        args: { name: Text }
        returns: Bool
        code: return ["apple", "pear", "mango", "cherry", "plum", "banana"].includes(args.name.toLowerCase())
      count_true:
        description: How many flags are true.
        args: { flags: 'Bool[]' }
        returns: Num
        code: return args.flags.filter(Boolean).length
inputs:
  root:
    name: "Head Office"
    reports:
      - name: "Apple"
        reports:
          - { name: "Logistics", reports: [] }
          - { name: "Mango", reports: [] }
      - name: "Finance"
        reports:
          - name: "Cherry"
            reports:
              - { name: "Plum", reports: [] }
expect:
  value: 4
lint:
  must: [flatten_tree used to reach every depth crisply, is_fruit_name called over the flattened names, count_true is crisp]
  must_not: [the root reading the tree level by level itself, a natlang function calling itself]
reference:
  count_fruit_units:
    calls:
      - { tool: call, args: { function: flatten_tree, to: let/units, inputs: { root: args/root } } }
      - { tool: call, args: { function: unit_names, to: let/names, inputs: { units: let/units } } }
      - { tool: call, args: { function: is_fruit_name, to: let/flags, over: let/names } }
      - { tool: call, args: { function: count_true, to: return, inputs: { flags: let/flags } } }
