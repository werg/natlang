id: 17-reopen-refine
title: An imported natural-language function is edited when its first draft is too long
kind: program
exercises: [inspect and edit an imported function, call it again, crisp check]
program:
  $lambda:
    type: '(report: string) => string'
    function: headline_for
    instructions: |
      Call `write_headline` and check the result with `too_long`.
      If it is too long, edit the existing imported function's instructions to require at most eight words,
      then call it again. Return the final headline.
    codebase:
      write_headline:
        description: A headline for a report.
        args: { report: string }
        returns: string
        instructions: |
          Write a headline for `report`, at most 15 words.
      too_long:
        description: Is the text more than 8 words?
        args: { text: string }
        returns: boolean
        code: return wordCount(text) > 8
inputs:
  report: "Quarterly revenue grew by four percent, driven mainly by strong sales in the northern region, while costs remained flat compared with the previous quarter."
expect:
  checks:
    - { kind: crisp, code: "wordCount(value) <= 8" }
    - { kind: judge, question: "Is it a headline about revenue growth?", answer: true }
lint:
  must:
    - a first headline produced by write_headline, checked crisply with too_long
    - if too long, edit write_headline and call it again
  must_not: [the root rewriting the headline itself]
reference:
  headline_for:
    steps:
      - eval: |-
          const headline = await write_headline(report);
          const bad = await too_long(headline);
          ({ headline, bad })
      - edit_function:
          name: write_headline
          find: "Write a headline for `report`, at most 15 words."
          replace_with: "Write a headline for `report`, at most 8 words."
      - eval: await write_headline(report)
  write_headline:
    variants:
      - if_body_contains: at most 8 words
        answer: Revenue grows four percent on northern sales
      - answer: Quarterly revenue grows four percent on strong northern sales as costs hold
