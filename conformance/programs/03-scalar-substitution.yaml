id: 03-scalar-substitution
title: A crisp step computes a number, a locals holds it, a crisp step formats the message
kind: program
exercises: [code base, crisp function, locals, conditional]
program:
  $lambda:
    type: 'Lambda<{ amounts: Num[], limit: Num }, Text>'
    function: budget_check
    instructions: |
      function budget_check(amounts, limit) -> Text

        total = sum_amounts(amounts)
        if total > limit:
            return over_message(total, limit)
        else:
            return "within budget"
    codebase:
      sum_amounts:
        description: Add up a list of amounts.
        args: { amounts: 'Num[]' }
        returns: Num
        code: return sum(args.amounts)
      over_message:
        description: The "over budget by N" message for an excess.
        args: { total: Num, limit: Num }
        returns: Text
        code: return `over budget by ${Math.round((args.total - args.limit) * 100) / 100}`
inputs:
  amounts: [120, 80.5, 310]
  limit: 400
expect:
  value: "over budget by 110.5"
lint:
  must:
    - sum_amounts called once to get the total
    - over_message called only because the total is above the limit
  must_not: [the root doing arithmetic itself, the root writing the message text directly]
reference:
  budget_check:
    calls:
      - { tool: call, args: { function: sum_amounts, to: let/total, inputs: { amounts: args/amounts } } }
      - { tool: call, args: { function: over_message, to: return, inputs: { total: let/total, limit: args/limit } } }
