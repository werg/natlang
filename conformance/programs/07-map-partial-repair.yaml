id: 07-map-partial-repair
title: A call over a list where one item first blocks; the root resumes it
kind: program
exercises: [code base, call over a list, report_blocker inside a mapped leaf, resume]
program:
  $lambda:
    type: 'Lambda<{ tickets: Text[] }, Label[]>'
    function: label_readable
    types:
      Label: '"question" | "complaint" | "unreadable"'
    instructions: |
      function label_readable(tickets) -> Label[]

        return for each t in tickets: classify_readable(t)
    codebase:
      classify_readable:
        description: Is this ticket a question or a complaint?
        args: { ticket: Text }
        returns: '"question" | "complaint" | "unreadable"'
        instructions: |
          Is the ticket in `args/ticket` a question or a complaint?
          If it cannot be read as text, say what is missing instead of guessing.
inputs:
  tickets:
    - "Why was my order cancelled?"
    - "xq zzv 0x00 ###"
    - "This is the third time the courier has lost my parcel. Unacceptable."
expect:
  value: [question, unreadable, complaint]
lint:
  must:
    - classify_readable called once, over args/tickets
    - the item that cannot be read blocks first, then is resumed with function and to only
  must_not: [the root labelling tickets itself, re-running the whole call for items already done]
reference:
  label_readable:
    calls:
      - { tool: call, args: { function: classify_readable, to: return, over: args/tickets } }
      - { tool: call, args: { function: classify_readable, to: return }, resume: true }
  classify_readable:
    answer_by:
      "Why was my order cancelled?": question
      "xq zzv 0x00 ###": { blocker: "The ticket is not readable text; it is neither a question nor a complaint.", then: unreadable }
      "This is the third time the courier has lost my parcel. Unacceptable.": complaint
