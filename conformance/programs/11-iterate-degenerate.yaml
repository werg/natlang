id: 11-iterate-degenerate
title: A loop that cannot progress is caught; the parent handles it
kind: program
exercises: [Iterate, cycle detection, quiesced combinator, parent handling]
program:
  $lambda:
    type: "Lambda<{ text: Text }, { text: Text, gave_up: Bool }>"
    instructions: |
      1. Repeatedly remove every word longer than 20 letters from `in/text` until it
         has fewer than 3 words. At most 6 rounds.
      2. If the loop cannot make progress, return the original text with gave_up true.
         Otherwise return the result with gave_up false.
inputs:
  text: "the quick brown fox"
expect:
  value: { text: "the quick brown fox", gave_up: true }
notes: >
  No word is longer than 20 letters, so the state never changes. The harness
  detects the repeated state by content hash and quiesces the Iterate as
  degenerate after the second round.
lint:
  must: [Iterate with max 6, parent reads the quiesce note, parent writes the fallback]
  must_not: [retrying the loop unchanged]
