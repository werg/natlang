id: 04-path-substitution
title: A crisp filter selects a sublist, a leaf summarizes only the selection
kind: program
exercises: [code base, crisp filter, call over a list, locals feeding a later call]
program:
  $lambda:
    type: 'Lambda<{ reviews: Text[] }, Text>'
    function: delivery_theme
    instructions: |
      function delivery_theme(reviews) -> Text

        flags    = for each r in reviews: mentions_delivery(r)
        selected = select_by_flags(reviews, flags)
        return summarize_delivery(selected)
    codebase:
      mentions_delivery:
        description: Does this review mention delivery?
        args: { review: Text }
        returns: Bool
        code: return lower(args.review).includes("delivery")
      select_by_flags:
        description: The items whose flag (same position) is true.
        args: { items: 'Text[]', flags: 'Bool[]' }
        returns: 'Text[]'
        code: return args.items.filter((_, i) => args.flags[i])
      summarize_delivery:
        description: One short sentence about what a set of delivery-related reviews have in common.
        args: { reviews: 'Text[]' }
        returns: Text
        instructions: |
          Write one sentence, at most 40 words, saying what `args/reviews` have in common about delivery.
inputs:
  reviews:
    - "Delivery took nine days. Never again."
    - "Lovely colour, fits well."
    - "The courier left it in the rain - delivery was a mess."
    - "Great value for the price."
    - "Arrived a week later than promised, delivery tracking was useless."
expect:
  checks:
    - { kind: judge, question: "Does the sentence say the delivery was slow, late, or badly handled?", answer: true }
    - { kind: crisp, code: "wordCount(value) <= 40" }
lint:
  must:
    - mentions_delivery called over args/reviews, once per review
    - select_by_flags used to pick the delivery-related reviews
    - summarize_delivery called once, over the selection only
  must_not: [the root reading every review's full text itself, an unrolled per-review summary]
reference:
  delivery_theme:
    calls:
      - { tool: call, args: { function: mentions_delivery, to: let/flags, over: args/reviews } }
      - { tool: call, args: { function: select_by_flags, to: let/selected, inputs: { items: args/reviews, flags: let/flags } } }
      - { tool: call, args: { function: summarize_delivery, to: return, inputs: { reviews: let/selected } } }
  summarize_delivery:
    answer: "Several reviews describe delivery as slow or mishandled, citing long waits, rough treatment by the courier, and unreliable tracking."
