id: 04-path-substitution
title: A crisp filter selects a sublist, a leaf summarizes only the selection
kind: program
exercises: [code base, crisp filter, call over a list, locals feeding a later call]
program:
  $lambda:
    type: '(reviews: string[]) => string'
    function: delivery_theme
    instructions: |
      Use `Promise.all(reviews.map(...))` with `mentions_delivery` to get one flag per review.
      Pass the reviews and flags to `select_by_flags`, then return `summarize_delivery(selected)`.
    codebase:
      mentions_delivery:
        description: Does this review mention delivery?
        args: { review: string }
        returns: boolean
        code: return lower(review).includes("delivery")
      select_by_flags:
        description: The items whose flag (same position) is true.
        args: { items: 'string[]', flags: 'boolean[]' }
        returns: 'string[]'
        code: return items.filter((_, i) => flags[i])
      summarize_delivery:
        description: One short sentence about what a set of delivery-related reviews have in common.
        args: { reviews: 'string[]' }
        returns: string
        instructions: |
          Write one sentence, at most 40 words, saying what `reviews` have in common about delivery.
inputs:
  reviews:
    - "Delivery took nine days. Never again."
    - "Lovely colour, fits well."
    - "The courier left it in the rain - delivery was a mess."
    - "Great value for the price."
    - "Arrived a week later than promised, delivery tracking was useless."
expect:
  checks:
    - { kind: judge, question: "Does the sentence say the delivery was slow, late, or badly handled?", answer: true }
    - { kind: crisp, code: "wordCount(value) <= 40" }
lint:
  must:
    - mentions_delivery called over reviews, once per review
    - select_by_flags used to pick the delivery-related reviews
    - summarize_delivery called once, over the selection only
  must_not: [the root reading every review's full text itself, an unrolled per-review summary]
reference:
  delivery_theme:
    eval: 'const flags = await Promise.all(reviews.map(async item => await mentions_delivery(item)));

      const selected = await select_by_flags(reviews, flags);

      await summarize_delivery(selected)'
  summarize_delivery:
    answer: Several reviews describe delivery as slow or mishandled, citing long waits, rough treatment
      by the courier, and unreliable tracking.
