id: 04-path-substitution
title: A crisp filter selects a sublist, a leaf summarizes only the selection
kind: program
exercises:
  - code base
  - crisp filter
  - call over a list
  - locals feeding a later call
root: delivery_theme.nl
files:
  delivery_theme.nl: |
    ---
    args:
      reviews: "string[]"
    returns: "string"
    ---
    Use `Promise.all(reviews.map(...))` with `mentions_delivery` to get one flag per review.
    Pass the reviews and flags to `select_by_flags`, then return `summarize_delivery(selected)`.
  delivery_theme/mentions_delivery.ts: |
    /** Does this review mention delivery? */
    export default function mentions_delivery(review: string): boolean {
      return review.toLowerCase().includes("delivery")
    }
  delivery_theme/select_by_flags.ts: |
    /** The items whose flag (same position) is true. */
    export default function select_by_flags(items: string[], flags: boolean[]): string[] {
      return items.filter((_, i) => flags[i])
    }
  delivery_theme/summarize_delivery.nl: |
    ---
    description: "One short sentence about what a set of delivery-related reviews have in common."
    args:
      reviews: "string[]"
    returns: "string"
    ---
    Write one sentence, at most 40 words, saying what `reviews` have in common about delivery.
inputs:
  reviews:
    - Delivery took nine days. Never again.
    - Lovely colour, fits well.
    - The courier left it in the rain - delivery was a mess.
    - Great value for the price.
    - Arrived a week later than promised, delivery tracking was useless.
expect:
  checks:
    - kind: judge
      question: Does the sentence say the delivery was slow, late, or badly handled?
      answer: true
    - kind: crisp
      code: value.trim().split(/\s+/).filter(Boolean).length <= 40
lint:
  must:
    - mentions_delivery called over reviews, once per review
    - select_by_flags used to pick the delivery-related reviews
    - summarize_delivery called once, over the selection only
  must_not:
    - the root reading every review's full text itself
    - an unrolled per-review summary
reference:
  delivery_theme:
    eval: |-
      const flags = await Promise.all(reviews.map(async item => await mentions_delivery(item)));
      const selected = await select_by_flags(reviews, flags);
      await summarize_delivery(selected)
  summarize_delivery:
    answer: Several reviews describe delivery as slow or mishandled, citing long waits, rough treatment by the
      courier, and unreliable tracking.
