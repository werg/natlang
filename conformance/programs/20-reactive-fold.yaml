id: 20-reactive-fold
title: A long-lived program is a top-level fold over an open list of events
kind: program
exercises: [root combinator, open list, state threading by the harness, effects in step, crisp decision]
program:
  $fold:
    type: 'Fold<Event, Shop>'
    types:
      Event: "{ text: Text }"
      Shop: "{ stock: Dict<Num>, coins: Num }"
    init: { stock: { apple: 0, pear: 3 }, coins: 0 }
    step:
      $lambda:
        type: 'Lambda<{ acc: Shop, item: Event }, Shop>'
        function: handle_message
        effects: [out.emit]
        codebase:
          decide_and_apply:
            description: >
              Decide what to do about the customer message (an item can be sold only if stock has at
              least one of it; declining is always legal; a sale removes one unit and adds 2 coins),
              emit a reply record { action, text }, and return the new shop state.
            args: { acc: 'Shop', text: Text }
            returns: 'Shop'
            effects: [out.emit]
            code: |
              const wants = Object.keys(args.acc.stock).find(k => args.text.toLowerCase().includes(k))
              const canSell = wants && args.acc.stock[wants] > 0
              const action = canSell ? "sell_" + wants : "decline"
              fx.out.emit({ action, text: canSell ? `One ${wants}, coming up!` : "Sorry, I can't help with that." })
              if (!canSell) return args.acc
              return { stock: { ...args.acc.stock, [wants]: args.acc.stock[wants] - 1 }, coins: args.acc.coins + 2 }
        instructions: |
          function handle_message(acc, item) -> Shop

            return decide_and_apply(acc, item.text)
streams:
  over:
    - { text: "A pear, please." }
    - { text: "Got any apples?" }
    - { text: "One more pear." }
    - $close
expect:
  value: { stock: { apple: 0, pear: 1 }, coins: 4 }
lint:
  must: [decide_and_apply decides, emits, and returns the new state together, crisply]
  must_not: [the step reading or writing anything outside its own node]
reference:
  known_issue: >
    A root-level Fold driven by an open/streaming list (`streams: { over: [...] }`) has no supported
    loading path: `natlang.runtime.OpenList` exists but nothing in `natlang/host.py` or `natlang/values.py`
    ever constructs one from YAML (there is no code anywhere, old or new, that reads a `streams:` key), so
    there is no way to run this program without adding new host-loading logic, which would mean patching
    the harness rather than authoring a program. The step function itself (`decide_and_apply`) is written
    in the new crisp/codebase style so the intent is preserved and ready once such loading exists.
