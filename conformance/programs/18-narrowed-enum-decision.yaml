id: 18-narrowed-enum-decision
title: A decision constrained to the legal actions, computed crisply
kind: program
exercises: [code base, crisp function, Dict, enum]
program:
  $lambda:
    type: 'Lambda<{ stock: Dict<Num>, request: Text }, Action>'
    function: choose_action
    types:
      Action: '"sell_apple" | "sell_pear" | "decline"'
    instructions: |
      function choose_action(stock, request) -> Action

        return decide_action(stock, request)
    codebase:
      decide_action:
        description: >
          Choose, among the legal actions (an item can be sold only if stock has at least one; declining
          is always legal), the one that serves the request. If what the customer wants cannot be sold,
          decline.
        args: { stock: 'Dict<Num>', request: Text }
        returns: '"sell_apple" | "sell_pear" | "decline"'
        code: |
          const legal = new Set(["decline", ...Object.keys(args.stock).filter(k => args.stock[k] > 0).map(k => "sell_" + k)])
          const wants = Object.keys(args.stock).find(k => args.request.toLowerCase().includes(k))
          const wanted = wants ? "sell_" + wants : "decline"
          return legal.has(wanted) ? wanted : "decline"
inputs:
  stock: { apple: 0, pear: 3 }
  request: "Two of your finest apples, please."
expect:
  value: decline
notes: >
  decide_action computes the legal set and the decision together, in code, so an illegal action
  (selling something with no stock) is never representable in the result.
lint:
  must: [decide_action computes the legal set and the decision crisply, in one call]
  must_not: [the root working out legality itself, the legal set typed out by the model]
reference:
  choose_action:
    calls:
      - { tool: call, args: { function: decide_action, to: return, inputs: { stock: args/stock, request: args/request } } }
