id: 09-fold-crisp-step
title: A fold whose step is a crisp function; no model episode below the root
kind: program
exercises: [code base, call with over+init (fold), crisp step, no model calls in the loop]
program:
  $lambda:
    type: 'Lambda<{ lines: Line[] }, Num>'
    function: order_total
    types:
      Line: '{ sku: Text, qty: Num, unit_price: Num }'
    instructions: |
      function order_total(lines) -> Num

        return fold over lines, starting from 0, adding each line's amount with add_line
    codebase:
      add_line:
        description: Running total plus one order line's amount.
        args: { item: Line, acc: Num }
        returns: Num
        code: return args.acc + args.item.qty * args.item.unit_price
inputs:
  lines:
    - { sku: "A1", qty: 2, unit_price: 9.5 }
    - { sku: "B7", qty: 1, unit_price: 120 }
    - { sku: "C3", qty: 10, unit_price: 0.75 }
expect:
  value: 146.5
lint:
  must: [add_line called with over+init (a fold), the step is crisp]
  must_not: [arithmetic done by the root itself]
reference:
  order_total:
    calls:
      - { tool: write, args: { path: let/start, type: Num, value: 0 } }
      - { tool: call, args: { function: add_line, to: return, over: args/lines, init: let/start } }
