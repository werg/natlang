id: 14-eval-side-effect
title: A crisp function with a declared effect; its return value is the count
kind: program
exercises:
  - code base
  - crisp function
  - effects declaration
  - effect journal
root: emit_critical.nl
files:
  emit_critical.nl: |
    ---
    args:
      alerts: "Alert[]"
    returns: "number"
    types:
      Alert: "{ id: string, level: string }"
    ---
    Return `await emit_critical_alerts(alerts)`. The helper emits the critical records and returns
    their count.
  emit_critical/types.ts: |
    export type Alert = { id: string, level: string };
  emit_critical/emit_critical_alerts.ts: |
    import { out } from 'natlang:services';

    /** Emit one output record { id } for every critical alert; return how many were emitted. */
    export default function emit_critical_alerts(alerts: Alert[]): number {
      let n = 0
      for (const a of alerts) {
        if (a.level === "critical") { out.emit({ id: a.id }); n++ }
      }
      return n
    }
inputs:
  alerts:
    - id: a1
      level: critical
    - id: a2
      level: info
    - id: a3
      level: critical
expect:
  value: 2
  emitted:
    - id: a1
    - id: a3
notes: "The emitted records are `{id: a1}` and `{id: a3}`; verified together with the return value by
  `expect.emitted`."
lint:
  must:
    - emit_critical_alerts declares out.emit and does the emitting and the counting together
  must_not:
    - the root emitting anything itself
    - an eval attempting to write the tree
reference:
  emit_critical:
    eval: await emit_critical_alerts(alerts)
