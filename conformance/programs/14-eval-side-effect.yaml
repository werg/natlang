id: 14-eval-side-effect
title: A crisp function with a declared effect; its return value is the count
kind: program
exercises: [code base, crisp function, effects declaration, effect journal]
program:
  $lambda:
    type: '(alerts: Alert[]) => number'
    function: emit_critical
    types:
      Alert: '{ id: string, level: string }'
    effects: [out.emit]
    instructions: |
      Return `await emit_critical_alerts(alerts)`. The helper emits the critical records and returns
      their count.
    codebase:
      emit_critical_alerts:
        description: Emit one output record { id } for every critical alert; return how many were emitted.
        args: { alerts: 'Alert[]' }
        returns: number
        effects: [out.emit]
        code: |
          let n = 0
          for (const a of alerts) {
            if (a.level === "critical") { fx.out.emit({ id: a.id }); n++ }
          }
          return n
inputs:
  alerts:
    - { id: "a1", level: "critical" }
    - { id: "a2", level: "info" }
    - { id: "a3", level: "critical" }
expect:
  value: 2
  emitted: [{ id: a1 }, { id: a3 }]
notes: "The emitted records are `{id: a1}` and `{id: a3}`; verified together with the return value by `expect.emitted`."
lint:
  must: [emit_critical_alerts declares out.emit and does the emitting and the counting together]
  must_not: [the root emitting anything itself, an eval attempting to write the tree]
reference:
  emit_critical:
    eval: await emit_critical_alerts(alerts)
