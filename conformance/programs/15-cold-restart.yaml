id: 15-cold-restart
title: Resume a half-reduced lambda from the tree alone
kind: program
exercises: [cold restart, progress inferred from the tree, effect journal consulted, no repeated effect]
start_state:
  $lambda:
    type: 'Lambda<{ alerts: Alert[] }, Result>'
    function: resume_alert_summary
    types:
      Alert: '{ id: Text, level: Text }'
      Result: '{ emitted: Num, summary: Text }'
    effects: [out.emit]
    status: quiesced
    note: "budget exhausted"
    instructions: |
      function resume_alert_summary(alerts) -> Result

        Write a one-line summary of the alerts in return/summary. (Emitting and counting are already done.)
    args:
      alerts:
        - { id: "a1", level: "critical" }
        - { id: "a2", level: "info" }
        - { id: "a3", level: "critical" }
    return:
      emitted: 2
    effects_journal:
      - { seq: 1, capability: out.emit, function: emit, args_preview: '{ id: "a1" }', status: ok }
      - { seq: 2, capability: out.emit, function: emit, args_preview: '{ id: "a3" }', status: ok }
expect:
  checks:
    - { kind: crisp, code: "value.emitted === 2" }
    - { kind: judge, question: "Is the summary a one-line description of three alerts, two of them critical?", answer: true }
notes: No new records may be emitted by the restarted episode; `return/emitted` is already correct.
lint:
  must: [the restarted episode's observation already shows the pre-filled return/emitted and the journal; only return/summary is written]
  must_not: [any out.emit call, return/emitted written again]
reference:
  resume_alert_summary:
    calls:
      - { tool: write, args: { path: return/summary, type: Text, value: "Three alerts came in; two of them, a1 and a3, were critical and one was informational." } }
