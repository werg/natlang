id: 13-crisp-lambda-produce
title: A value that belongs in the tree is produced by a crisp function, not by tokens
kind: program
exercises: [code base, crisp function, large value never passes through the model]
program:
  $lambda:
    type: 'Lambda<{ emails: Text[] }, Text[]>'
    function: distinct_emails
    instructions: |
      function distinct_emails(emails) -> Text[]

        return normalize_emails(emails)
    codebase:
      normalize_emails:
        description: The distinct email addresses, lower-cased and sorted.
        args: { emails: 'Text[]' }
        returns: 'Text[]'
        code: return uniq(args.emails.map(lower)).sort()
inputs:
  emails: ["Zed@x.org", "amy@x.org", "AMY@x.org", "bob@y.com", "zed@X.org", "cy@z.net"]
expect:
  value: ["amy@x.org", "bob@y.com", "cy@z.net", "zed@x.org"]
lint:
  must: [normalize_emails called once, with the whole list, and its result returned unchanged]
  must_not: [the root retyping or re-emitting the list itself]
reference:
  distinct_emails:
    calls:
      - { tool: call, args: { function: normalize_emails, to: return, inputs: { emails: args/emails } } }
