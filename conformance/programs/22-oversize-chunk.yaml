id: 22-oversize-chunk
title: An input too large to read whole is split crisply and mapped
kind: program
exercises: [code base, crisp split, call over a list, crisp aggregate]
program:
  $lambda:
    type: '(log: string) => number'
    function: count_complaints
    instructions: |
      Split the log with `split_log`, classify each line with `Promise.all(lines.map(...))` and
      `is_complaint`, then return `count_true(flags)`.
    codebase:
      split_log:
        description: The log split into one entry per non-empty line.
        args: { log: string }
        returns: 'string[]'
        code: return splitLines(log)
      is_complaint:
        description: Is this customer comment a complaint?
        args: { line: string }
        returns: boolean
        instructions: |
          Is the comment in `line` a complaint? Answer true or false.
      count_true:
        description: How many flags are true.
        args: { flags: 'boolean[]' }
        returns: number
        code: return flags.filter(Boolean).length
inputs:
  log: |
    Arrived broken, very disappointed.
    Love it, thank you!
    Still waiting after three weeks. This is ridiculous.
    Works as described.
    The colour is nothing like the photo and nobody answers my emails.
    Five stars.
    Charged twice and no refund yet - terrible.
    Does what it says.
    Quick delivery, nicely packed.
    Stopped working after two days. Want my money back.
    Perfect gift.
    Great price.
    Instructions were missing and support hung up on me.
    Happy with the purchase.
    Would buy again.
    The zip broke the first time I used it, poor quality.
    Lovely.
    Exactly what I needed.
    Wrong size sent, return label never arrived, awful service.
    Nice and sturdy.
expect:
  value: 8
lint:
  must:
    - the log is never read whole by the model
    - split_log is crisp and produces the lines
    - is_complaint called over the split lines
    - count_true is crisp
  must_not: [the root reading log directly]
reference:
  count_complaints:
    eval: 'const lines = await split_log(log);

      const flags = await Promise.all(lines.map(async item => await is_complaint(item)));

      await count_true(flags)'
  is_complaint:
    answer_by:
      Arrived broken, very disappointed.: true
      Love it, thank you!: false
      Still waiting after three weeks. This is ridiculous.: true
      Works as described.: false
      The colour is nothing like the photo and nobody answers my emails.: true
      Five stars.: false
      Charged twice and no refund yet - terrible.: true
      Does what it says.: false
      Quick delivery, nicely packed.: false
      Stopped working after two days. Want my money back.: true
      Perfect gift.: false
      Great price.: false
      Instructions were missing and support hung up on me.: true
      Happy with the purchase.: false
      Would buy again.: false
      The zip broke the first time I used it, poor quality.: true
      Lovely.: false
