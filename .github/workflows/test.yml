name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Both machines push to main often: a run in progress on main finishes (only the newest pending run waits behind
# it), so main gets results; other branches cancel superseded runs.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install TypeScript dependencies
        # The workspace install: the staged npm packages resolve their dependencies from it too.
        run: npm ci
      - name: Install ffmpeg for the media workbench tests
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - name: Runtime, applications, and conformance tests
        working-directory: ts-host
        run: npm test
      - name: Training tools tests
        run: |
          # CPU torch and transformers for the training-tool tests; model-backed tests skip without a cached model.
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]' transformers
          python -m pytest -q
      - name: Install Chromium for browser smoke tests
        working-directory: ts-host
        run: npx playwright-core install --with-deps chromium
      - name: Browser runtime and board smoke
        working-directory: ts-host
        run: npm run test:browser -- --application
      - name: Browser playground smoke
        working-directory: ts-host
        run: npm run test:playground
