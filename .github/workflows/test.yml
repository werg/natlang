name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Both machines push to main often: a run in progress on main finishes (only the newest pending run waits behind
# it), so main gets results; other branches cancel superseded runs.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # Training continuation and provenance checks intentionally resolve exact
          # historical Git objects recorded by recipes and receipts. The default
          # shallow checkout omits those objects and makes valid recovery checks
          # fail in CI; fetch the repository history so those checks remain strict.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install TypeScript and pinned selected tracer dependencies
        # The workspace install: the staged npm packages resolve their dependencies from it too.
        run: npm ci
      - name: Install callable-folder application dependencies
        # applications/pi has its own lockfile and is not an npm workspace.
        # The application compiler needs these exact dependencies.
        run: npm --prefix applications/pi ci
      - name: Install ffmpeg for the media workbench tests
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - name: Runtime, applications, and conformance tests
        id: runtime_tests
        working-directory: ts-host
        run: npm test
      - name: Training tools tests
        run: |
          # CPU torch and transformers for the training-tool tests; model-backed tests skip without a cached model.
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Install the test suite's declared data extra (zstandard) and Triton,
          # which is declared in the train extra but is imported by CPU-safe
          # Neuralese tests as well. Do not install the train extra here: it
          # pins a CUDA-agnostic torch wheel and would replace the CPU build.
          python -m pip install -e '.[dev,data]' transformers 'triton==3.6.0; sys_platform == "linux"'
          python -m pytest -q
      - name: Install Chromium for browser smoke tests
        if: ${{ always() && steps.runtime_tests.outcome == 'success' }}
        id: chromium_install
        working-directory: ts-host
        run: npx playwright-core install --with-deps chromium
      - name: Browser runtime and board smoke
        if: ${{ always() && steps.runtime_tests.outcome == 'success' && steps.chromium_install.outcome == 'success' }}
        working-directory: ts-host
        run: npm run test:browser -- --application
      - name: Browser playground smoke
        if: ${{ always() && steps.runtime_tests.outcome == 'success' && steps.chromium_install.outcome == 'success' }}
        working-directory: ts-host
        run: npm run test:playground
