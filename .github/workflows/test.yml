name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install TypeScript dependencies
        run: npm --prefix ts-host ci
      - name: Runtime, applications, and conformance tests
        working-directory: ts-host
        run: npm test
      - name: Training tools tests
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q --ignore=tests/test_train_checkpoint_recovery.py --ignore=tests/test_training_readiness.py --ignore=tests/test_training_loss.py
      - name: Install Chromium for browser smoke tests
        working-directory: ts-host
        run: npx playwright-core install --with-deps chromium
      - name: Browser runtime and board smoke
        working-directory: ts-host
        run: npm run test:browser -- --application
      - name: Browser playground smoke
        working-directory: ts-host
        run: npm run test:playground
