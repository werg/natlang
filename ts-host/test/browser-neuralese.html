<!doctype html>
<meta charset="utf-8">
<title>natlang Neuralese in the browser</title>
<main id="result">RUNNING</main>
<script type="module">
  // The browser runtime with Neuralese: the fork's service as WebAssembly in a Web Worker, reached by the ordinary
  // Neuralese driver and store through an in-process endpoint. Model files come from ?model=…&heads=… (GGUF URLs).
  import * as natlang from '../dist/browser/natlang.js';
  const params = new URLSearchParams(location.search);
  const report = {};
  try {
    // ?cache=1: through the OPFS model-file cache (downloaded once, then opened from disk); otherwise fetched.
    let started0 = performance.now();
    const load = url => params.get('cache') === '1' ? natlang.cachedModelFile({ url }) : fetch(url).then(response => response.blob());
    const [model, heads] = await Promise.all([params.get('model'), params.get('heads')].map(load));
    report.files_ms = Math.round(performance.now() - started0);
    if (params.get('cache') === '1') {
      started0 = performance.now();
      const again = await Promise.all([params.get('model'), params.get('heads')].map(load));
      report.cached_files_ms = Math.round(performance.now() - started0);
      report.cached_bytes = again.reduce((sum, blob) => sum + blob.size, 0);
    }
    const worker = new Worker(new URL('../dist/browser/neuralese-worker.js', import.meta.url), { type: 'module' });
    let started = performance.now();
    // The build for this browser: WebGPU when an adapter offers shader-f16 (?gpu=force: the WebGPU build regardless),
    // else threads when the page is cross-origin isolated (SharedArrayBuffer), else one thread.
    if (navigator.gpu) {
      const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
      report.adapter = adapter ? { vendor: adapter.info?.vendor, description: adapter.info?.description, f16: adapter.features.has('shader-f16') } : null;
    }
    const chosen = params.get('gpu') === 'force' ? { build: 'neuralese-wasm-gpu', threads: 1, gpuLayers: 999, reason: 'forced' }
      : await natlang.chooseNeuraleseBuild(self, { gpu: params.get('gpu') !== '0' });
    const { build, threads, gpuLayers } = chosen;
    const service = await natlang.startBrowserNeuralese({ worker, model, heads, maxBlock: 6, nCtx: 4096, threads, gpuLayers,
      moduleUrl: new URL(`../dist/browser/${build}.mjs`, import.meta.url).href });
    report.build = build;
    report.reason = chosen.reason;
    report.threads = threads;
    report.load_ms = Math.round(performance.now() - started);
    report.dialect = service.dialect;
    report.devices = service.devices;
    report.gpu_layers = service.gpu_layers;
    // The runtime's block archive (OPFS when offered): blocks the engine lacks after a reload are restored from it.
    const store = service.store;
    const driver = natlang.neuraleseServerModelTurn({ endpoint: service.endpoint, model: 'natlang-neuralese', store });
    // A plain turn, then a turn that writes a block (forced plan), then reading that block back from the store.
    started = performance.now();
    const plain = await driver({ messages: [{ role: 'user', content: 'Say hi.' }], tools: [], seed: null, max_tokens: 8 });
    report.plain = plain.text;
    report.plain_ms = Math.round(performance.now() - started);
    // Prefill speed: a long prompt and one generated token; then decode speed: a short prompt and 32 tokens.
    started = performance.now();
    const long = await driver({ messages: [{ role: 'user', content: 'Summarise: ' + 'The committee met on Tuesday to review the budget. '.repeat(60) }], tools: [], seed: null, max_tokens: 1 });
    report.prefill_tokens = long.prompt_tokens;
    report.prefill_ms = Math.round(performance.now() - started);
    started = performance.now();
    const decoded = await driver({ messages: [{ role: 'user', content: 'Count from one to fifty in words.' }], tools: [], seed: null, max_tokens: 32 });
    report.decode_tokens = decoded.completion_tokens;
    report.decode_ms = Math.round(performance.now() - started);
    const writing = natlang.neuraleseServerModelTurn({ endpoint: service.endpoint, model: 'natlang-neuralese', store,
      request: { x_natlang_forced: ['Note: ', { neuralese: 'write' }] } });
    const written = await writing({ messages: [{ role: 'user', content: 'Write a note.' }], tools: [], seed: null, max_tokens: 16 });
    report.written_turn = JSON.stringify(written).slice(0, 600);
    const id = JSON.stringify(written).match(/nz1_[a-z2-7]{52}/)?.[0];
    report.block = id ? await store.meta(id) : null;
    // A natlang call through the runtime: a Neuralese<string> result by template readout.
    const runtime = natlang.createNatlangRuntime({ model: { driver }, neuralese: { store }, seed: { mode: 'backend' } });
    const fn = natlang.loadVirtualNatlang({ 'note.nl': '---\nargs: { text: string }\nreturns: Neuralese<string>\nreadout: template\n---\nNote it.\n' }, 'note.nl');
    started = performance.now();
    const value = await runtime.run(() => fn('the meeting moved to Tuesday'));
    report.template_ms = Math.round(performance.now() - started);
    report.template_value = value?.$neuralese ?? null;
    await service.close();
    report.ok = Boolean(report.plain && report.block?.length && report.template_value?.id);
  } catch (error) {
    report.error = String(error?.stack ?? error);
  }
  document.querySelector('#result').textContent = JSON.stringify(report);
  window.__neuraleseReport = report;
</script>
