<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local natlang interpreter</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 52rem; margin: 2rem auto; padding: 0 1rem; }
  label { display: block; margin: 1rem 0; }
  input, textarea { box-sizing: border-box; display: block; width: 100%; font: inherit; padding: .5rem; }
  textarea { min-height: 7rem; }
  button { padding: .5rem 1rem; font: inherit; }
  pre { overflow-wrap: anywhere; white-space: pre-wrap; }
</style>
<h1>Local natlang interpreter</h1>
<p>The model and interpreter run in this browser. The initial model download comes from Hugging Face.</p>
<label>GGUF repository <input id="repo" value="Qwen/Qwen3-0.6B-GGUF"></label>
<label>Quantization <input id="quant" value="Q4_K_M"></label>
<button id="load">Load model</button>
<p id="status" role="status">Model not loaded</p>
<label>Task <textarea id="task">Count the letters in “natlang” and return the count.</textarea></label>
<button id="run" disabled>Run natlang</button>
<pre id="result"></pre>
<script type="module">
  import { BrowserLocalModel, BrowserNatlangHost } from '../../dist/browser/natlang.js';
  const model = new BrowserLocalModel();
  const host = new BrowserNatlangHost({ model });
  const $ = id => document.getElementById(id);
  const status = text => { $('status').textContent = text; };
  $('load').onclick = async () => {
    $('load').disabled = true;
    $('run').disabled = true;
    try {
      await model.loadFromHuggingFace({ repo: $('repo').value, quant: $('quant').value }, {
        contextTokens: 8192,
        onProgress: ({ loaded, total }) => status(`Downloading ${Math.round(loaded / total * 100)}%`),
      });
      status('Model ready');
      $('run').disabled = false;
    } catch (error) { status(`Model load failed: ${error.message}`); }
    finally { $('load').disabled = false; }
  };
  $('run').onclick = async () => {
    $('run').disabled = true;
    $('result').textContent = '';
    status('Running');
    try {
      const result = await host.run({ source: { kind: 'program', program: {
        $lambda: { type: 'Lambda<{}, Num>', instructions: $('task').value },
      } }, options: { model: { max_turns: 12, max_tokens: 8192, turn_tokens: 512 } } });
      $('result').textContent = JSON.stringify({ outcome: result.outcome, value: result.value,
        trace: result.trace }, null, 2);
      status(result.outcome.kind);
    } catch (error) { status(`Run failed: ${error.message}`); }
    finally { $('run').disabled = false; }
  };
  window.addEventListener('pagehide', () => { host.close(); void model.close(); });
</script>
</html>
