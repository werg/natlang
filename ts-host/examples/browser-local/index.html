<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>natlang browser inference pilot</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 60rem; margin: 2rem auto; padding: 0 1rem; }
  label { display: block; margin: .7rem 0; }
  input, textarea, select { box-sizing: border-box; width: 100%; font: inherit; padding: .4rem; }
  textarea { min-height: 5rem; }
  button { font: inherit; padding: .5rem .8rem; margin: .2rem .2rem .2rem 0; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #f4f4f4; padding: .8rem; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: .8rem; }
</style>
<h1>natlang browser inference pilot</h1>
<p>The model and interpreter run locally. Serve this page from the natlang repository root to use the trained natlang GGUF (about 379 MB).</p>
<div class="row">
  <label>Model <select id="model"></select></label>
  <label>GPU layers <input id="gpuLayers" type="number" min="0" placeholder="Auto (all supported layers, else CPU)"></label>
  <label>Context tokens <input id="context" type="number" min="512" value="8192"></label>
</div>
<label>Or use a local GGUF <input id="file" type="file" accept=".gguf"></label>
<button id="load">Load model</button><button id="cpu" disabled>Retry with CPU</button>
<button id="persist">Request persistent storage</button>
<p id="storage"></p><p id="status" role="status">Checking browser capabilities…</p>
<pre id="diagnostics"></pre>
<h2>Run</h2>
<label>Single-task instructions <textarea id="task">Return the number 7.</textarea></label>
<button id="run" disabled>Run task</button><button id="suite" disabled>Run three-task pilot</button>
<button id="cancel" disabled>Cancel</button><button id="download" disabled>Download report</button>
<pre id="result"></pre>
<script type="module">
  import { createNatlangRuntime, loadBrowserLocalModel, loadBrowserModelCatalog, newPlaygroundProject,
    runPlaygroundProject, probeBrowserGpu, checkModelStorage } from '../../dist/browser/natlang.js';
  const $ = id => document.getElementById(id);
  const mb = bytes => (bytes / 1_000_000).toFixed(1) + ' MB';
  const canonical = value => Array.isArray(value) ? value.map(canonical) :
    value && typeof value === 'object' ? Object.fromEntries(Object.keys(value).sort()
      .map(key => [key, canonical(value[key])])) : value;
  const catalog = await loadBrowserModelCatalog();
  const models = catalog.models;
  $('model').innerHTML = models.map((item, index) =>
    `<option value="${index}">${item.label}</option>`).join('');
  $('model').value = String(models.findIndex(item => item.id === catalog.defaultId));
  const chosen = () => models[Number($('model').value)];
  const status = value => { $('status').textContent = value; };
  let model, controller, reports = [];
  /** Model turns go through `model.turn` at call time, so a harness may wrap it. */
  const runtime = limits => createNatlangRuntime({ model: { driver: (request, signal) => model.turn(request, signal),
    maxTurns: 20, maxTokens: 2048, turnTokens: 128, validationFeedback: 'local', ...limits } });
  async function inspect() {
    const spec = chosen(), storage = await checkModelStorage(spec);
    $('storage').textContent = `${mb(spec.bytes)} download; recommended free ${mb(storage.recommendedFree)}; ` +
      `available ${storage.available === null ? 'unknown' : mb(storage.available)}; ` +
      `persistent storage ${storage.persisted === null ? 'unknown' : storage.persisted ? 'on' : 'off'}.`;
    const gpu = await probeBrowserGpu();
    $('diagnostics').textContent = JSON.stringify({ secure_context: isSecureContext,
      cross_origin_isolated: crossOriginIsolated, gpu, model: model?.diagnostics ?? null,
      note: 'Wllama does not expose actual GPU layers; compare GPU and CPU pilot timings.' }, null, 2);
    return storage;
  }
  $('model').onchange = () => { $('context').value = chosen().contextTokens; void inspect(); };
  $('persist').onclick = async () => {
    try { status(await navigator.storage.persist() ? 'Persistent storage enabled' : 'Persistence not granted'); }
    catch (error) { status(`Storage request failed: ${error.message}`); }
    await inspect();
  };
  async function load() {
    $('load').disabled = true; $('run').disabled = true; $('suite').disabled = true;
    try {
      const file = $('file').files[0], storage = await inspect();
      if (!file && storage.enough === false) throw new Error('Estimated storage is too low for this download');
      const contextTokens = Number($('context').value);
      if (!Number.isInteger(contextTokens) || contextTokens < 512) throw new Error('Context must be at least 512 tokens');
      const gpuLayers = $('gpuLayers').value === '' ? undefined : Number($('gpuLayers').value);
      const options = { contextTokens,
        ...(gpuLayers === undefined ? {} : { gpuLayers }),
        onProgress: ({ loaded, total }) => status(total ?
          `Downloading ${Math.round(loaded / total * 100)}% (${mb(loaded)} / ${mb(total)})` : 'Loading model…') };
      status(`Loading ${file?.name ?? chosen().label}…`);
      await model?.close();
      const loaded = await loadBrowserLocalModel(file ? { kind: 'files', files: [file], id: file.name, templateUrl: chosen().templateUrl } :
        { kind: 'url', id: chosen().id, url: chosen().url, templateUrl: chosen().templateUrl }, options);
      model = loaded.model;
      $('cpu').disabled = true; $('run').disabled = false; $('suite').disabled = false;
      await inspect();
      status(`Model ready in ${(model.lastLoadMs / 1000).toFixed(1)} s; ${model.diagnostics.gpuSelectionReason}` +
        (loaded.status.gpuFallbackReason ? ` (GPU load failed: ${loaded.status.gpuFallbackReason})` : ''));
    } catch (error) {
      $('cpu').disabled = $('gpuLayers').value === '0';
      status(`Load failed: ${error.message}. CPU retry is available if the GPU path failed.`);
    } finally { $('load').disabled = false; }
  }
  $('load').onclick = load;
  $('cpu').onclick = () => { $('gpuLayers').value = '0'; void load(); };
  const nl = (args, returns, instructions) => `---\nargs: ${args}\nreturns: ${returns}\n---\n${instructions}\n`;
  const tasks = [
    { id: 'leaf', root: 'seven.nl', files: { 'seven.nl': nl('{}', 'number', 'Return the number 7.') }, inputs: {}, expected: 7 },
    { id: 'record', root: 'sum.nl', inputs: { a: 3, b: 5 }, expected: { sum: 8, larger: 5 },
      files: { 'sum.nl': nl('{ a: number, b: number }', '"{ sum: number, larger: number }"', 'Add a and b; return the sum and the larger input.') } },
    { id: 'nested-map', root: 'double_all.nl', inputs: { items: [2, 3] }, expected: [4, 6], files: {
      'double_all.nl': nl('{ items: "number[]" }', '"number[]"', 'Call double on each of items and return the resulting list.'),
      'double_all/double.nl': nl('{ item: number }', 'number', 'Return twice item.') } },
  ];
  async function execute(task) {
    const before = model.turnHistory.length, started = performance.now();
    const run = await runPlaygroundProject(runtime(), newPlaygroundProject(task.id, task.root, task.files, task.inputs, task.expected),
      { signal: controller.signal });
    const trace = run.trace, turns = model.turnHistory.slice(before);
    return { id: task.id, expected: task.expected, outcome: run.outcome, value: run.value,
      error: run.outcome.kind === 'done' ? null : run.outcome.detail,
      correct: run.outcome.kind === 'done' && JSON.stringify(canonical(run.value)) === JSON.stringify(canonical(task.expected)),
      total_ms: Math.round(performance.now() - started),
      prompt_tokens: turns.reduce((n, turn) => n + (turn.promptTokens ?? 0), 0),
      cached_tokens: turns.reduce((n, turn) => n + (turn.cachedTokens ?? 0), 0),
      completion_tokens: turns.reduce((n, turn) => n + (turn.completionTokens ?? 0), 0),
      schema_bytes: turns.map(turn => turn.toolSchemaBytes),
      retries: turns.reduce((n, turn) => n + turn.retries, 0),
      inference_ms: turns.reduce((n, turn) => n + turn.durationMs, 0),
      actions: trace.filter(event => event.kind === 'action').length,
      rejected_actions: trace.filter(event => event.kind === 'action' &&
        ['rejected', 'refused', 'error'].includes(event.outcome)).length, trace };
  }
  async function run(selected) {
    controller = new AbortController();
    $('run').disabled = true; $('suite').disabled = true; $('cancel').disabled = false;
    try {
      const results = [];
      for (const task of selected) {
        status(`Running ${task.id}…`);
        results.push(await execute(task));
        $('result').textContent = JSON.stringify(results.map(({ trace, ...rest }) => rest), null, 2);
        if (controller.signal.aborted) break;
      }
      reports.push({ schema: 'natlang.browser_pilot/1', at: new Date().toISOString(),
        user_agent: navigator.userAgent, model: $('file').files[0]?.name ?? chosen().id,
        tool_schema: 'scope-eval-v1', diagnostics: model.diagnostics, load_ms: model.lastLoadMs,
        tasks: results.map(({ trace, ...rest }) => rest),
        traces: results.map(result => ({ id: result.id, events: result.trace })) });
      $('download').disabled = false;
      status(`${results.filter(item => item.correct).length}/${results.length} correct. ` +
        `Reports retained: ${reports.length}.`);
    } finally {
      controller = null; $('cancel').disabled = true; $('run').disabled = false; $('suite').disabled = false;
    }
  }
  /** The first model request of a natlang invocation, without running inference. */
  async function captureRequest(instructions = 'Return the number 7.') {
    let captured;
    await runPlaygroundProject(createNatlangRuntime({ model: { driver: request => { captured ??= request;
      return { calls: [], text: 'probe', completion_tokens: 1 }; }, maxTurns: 1 } }),
      newPlaygroundProject('probe', 'probe.nl', { 'probe.nl': nl('{}', 'number', instructions) }));
    return captured;
  }
  window.natlangPilot = { get model() { return model; }, get reports() { return reports; }, run, tasks, captureRequest };
  $('run').onclick = () => void run([{ id: 'single', root: 'task.nl', files: { 'task.nl': nl('{}', 'number', $('task').value) },
    inputs: {}, expected: 7 }]);
  $('suite').onclick = () => void run(tasks);
  $('cancel').onclick = () => controller?.abort();
  $('download').onclick = () => {
    const url = URL.createObjectURL(new Blob([JSON.stringify({ reports }, null, 2)], { type: 'application/json' }));
    const anchor = document.createElement('a'); anchor.href = url; anchor.download = 'natlang-browser-pilot.json';
    anchor.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
  window.addEventListener('pagehide', () => { void model?.close(); });
  void inspect();
</script>
</html>
