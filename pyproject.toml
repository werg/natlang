[project]
name = "natlang-training"
version = "0.1.0"
description = "Training-data preparation and model fine-tuning tools for the natlang interpreter model"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
# Training commands are checkout scripts, not importable distribution packages.
# Explicit discovery also keeps datasets and generated runs out of the wheel.
# The one importable package is the Neuralese port reference (plans/neuralese/S3_PORT.md).
package-dir = { "" = "training/neuralese" }
packages = ["natlang_neuralese", "natlang_neuralese.model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
