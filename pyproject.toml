[project]
name = "natlang"
version = "0.1.0"
description = "Harness for a small-model interpreter of natural-language programs"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
js = ["quickjs-ng"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["natlang"]

[tool.pytest.ini_options]
testpaths = ["tests"]
